worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 3000;
        root /var/www/html/public;
        index index.php;

        # La aplicacion web vive en /app. Es una SPA con enrutado propio, asi que
        # cualquier ruta que no sea un fichero real devuelve su index.html.
        location /app/ {
            index index.html;
            try_files $uri $uri/ /app/index.html;
        }

        # El service worker no se cachea nunca: es lo que detecta que hay version nueva.
        location = /app/sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }

        location = /app/index.html {
            add_header Cache-Control "no-cache";
            expires off;
        }

        # Los ficheros con hash en el nombre se pueden cachear para siempre.
        location /app/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
