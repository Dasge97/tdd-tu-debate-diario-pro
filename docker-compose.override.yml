# Override para desarrollo local — usa imágenes ya disponibles sin necesidad de pull
# docker-compose.yml = producción (MySQL 8, PHP 8.4-fpm)
# Este archivo = dev local (PostgreSQL 16, PHP 8.2 built-in server)
#
# Uso: docker compose up  (aplica automáticamente este override)

services:
  db:
    image: postgres:16-alpine
    container_name: tdd_db
    environment:
      POSTGRES_DB: tdd_app
      POSTGRES_USER: tdd_user
      POSTGRES_PASSWORD: tdd_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdd_user -d tdd_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: true-duel-api:latest
    container_name: tdd_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "echo '<?php' > /app/vendor/composer/platform_check.php &&
             php bin/console doctrine:schema:create --no-interaction 2>/dev/null || true &&
             php bin/console doctrine:schema:update --force --no-interaction &&
             php bin/console doctrine:fixtures:load --no-interaction --append &&
             php -S 0.0.0.0:3000 -t public"
    environment:
      DATABASE_URL: "postgresql://tdd_user:tdd_pass@db:5432/tdd_app?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_SECRET: dev_secret_not_for_production
      JWT_SECRET: dev_jwt_secret_not_for_production
      WORKER_API_KEY: dev_worker_key
      CORS_ALLOW_ORIGIN: "^https?://localhost(:[0-9]+)?$"
    depends_on:
      db:
        condition: service_healthy

  backend-ws:
    image: true-duel-api:latest
    container_name: tdd_backend_ws
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "echo '<?php' > /app/vendor/composer/platform_check.php &&
             sleep 15 && php bin/console app:websocket-server"
    environment:
      DATABASE_URL: "postgresql://tdd_user:tdd_pass@db:5432/tdd_app?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_SECRET: dev_secret_not_for_production
      JWT_SECRET: dev_jwt_secret_not_for_production
      WS_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles:
      - worker
