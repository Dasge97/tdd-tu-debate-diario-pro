name: tdd_app
description: "TDD — Tu Debate Diario. Plataforma de debates de actualidad con perfiles IA."
publish_to: 'none'

version: 1.0.0+101

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.3
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FAF7F1"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF7F1"
  android_12:
    color: "#FAF7F1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/personas/
